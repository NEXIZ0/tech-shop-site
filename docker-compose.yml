version: '3.8'

services:
  database:
    image: mysql:8.0
    container_name: techstore-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_DATABASE:-techstore_db}
      MYSQL_USER: ${DB_USERNAME:-techstore_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-techstore_pass}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seeds.sql:/docker-entrypoint-initdb.d/02-seeds.sql:ro
    networks:
      - techstore-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: techstore-backend
    restart: always
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-techstore_db}
      DB_USERNAME: ${DB_USERNAME:-techstore_user}
      DB_PASSWORD: ${DB_PASSWORD:-techstore_pass}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_techstore_2026_uniproject}
    volumes:
      - ./backend:/var/www/html
      - uploads_data:/var/www/html/public/uploads
    depends_on:
      database:
        condition: service_healthy
    networks:
      - techstore-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: techstore-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - techstore-network

volumes:
  db_data:
  uploads_data:

networks:
  techstore-network:
    driver: bridge
